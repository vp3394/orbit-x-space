
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORBIT X | Explore the Future</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #142b57, #030611 70%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    nav {
      padding: 24px;
      color: #70d9ff;
      letter-spacing: 4px;
      border-bottom: 1px solid #243b60;
    }

    main {
      padding: 90px 20px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 80px);
      margin-bottom: 16px;
      text-shadow: 0 0 28px #168cff;
    }

    p {
      color: #b9c9e8;
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      margin-top: 22px;
      padding: 15px 25px;
      color: white;
      background: #1768e5;
      border: 1px solid #70d9ff;
      border-radius: 30px;
      cursor: pointer;
    }

    button:hover {
      background: #348aff;
      box-shadow: 0 0 25px #1768e5;
    }
  </style>
</head>
<body>
  <nav>✦ ORBIT X</nav>

  <main>
    <p>YOUR JOURNEY BEGINS HERE</p>
    <h1>Explore the Future.</h1>
    <p>
      Discover distant worlds, explore Mars,
      and imagine humanity's next giant leap.
    </p>
    <button onclick="alert('Mission launched! Welcome to ORBIT X.')">
      Launch Your Mission 🚀
    </button>
  </main>
</body>
</html>
